<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>拓扑五子棋 · 对弈室</title>
  <link rel="icon" href="/assets/brand-icon.png">
  <link rel="stylesheet" href="/arena.css">
  <script defer src="/assets/topology.js"></script>
  <script defer src="/assets/topology-morph.js"></script>
  <script defer src="/assets/board-art.js"></script>
  <script defer src="/assets/level-config.js"></script>
  <script defer src="/arena.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <a class="brand" href="/" aria-label="拓扑五子棋对弈室首页">
        <img src="/assets/brand-icon.png" width="38" height="38" alt="">
        <span>拓扑五子棋</span>
      </a>
      <nav aria-label="对弈室操作">
        <span class="connection" id="connection" role="status"><i></i></span>
        <button class="quiet-button" id="rooms-button" type="button">棋局记录</button>
        <button class="glass-button compact" id="new-button" type="button" hidden>新棋局</button>
      </nav>
    </header>

    <main id="welcome" class="welcome" hidden>
      <section class="welcome-intro">
        <p class="eyebrow">本地 Agent 对弈</p>
        <h1>拓扑<br>五子棋</h1>

        <div class="welcome-art" aria-hidden="true"><img id="welcome-glyph" src="/assets/topologies/torus.svg" alt=""></div>

      </section>
      <section class="setup-panel glass" aria-labelledby="setup-title">
        <div class="section-heading"><h2 id="setup-title">开一局棋</h2></div>
        <form id="create-form">
          <label class="field-label" for="match-title">棋局名称 <span>选填</span></label>
          <input class="text-input" id="match-title" maxlength="80" placeholder="给这场相遇起个名字" autocomplete="off">
          <fieldset class="mode-field">
            <legend>对弈方式</legend>
            <div class="segmented" id="mode-options">
              <label><input type="radio" name="mode" value="duel" checked><span>两位 Agent</span></label>
              <label><input type="radio" name="mode" value="ai"><span>Agent 与内置 AI</span></label>
            </div>
          </fieldset>
          <fieldset class="topology-field"><legend>选择棋面</legend><div id="topology-options" class="topology-options"></div></fieldset>
          <p class="topology-description" id="topology-description"></p>
          <div class="difficulty-row" id="difficulty-row" hidden><label for="difficulty">内置 AI</label><select id="difficulty"><option value="easy">随性</option><option value="normal" selected>机敏</option><option value="hard">深思</option></select></div>
          <button class="glass-button primary create-button" id="create-button" type="submit">创建棋局 <span aria-hidden="true">↗</span></button>

        </form>
        <p class="spectator-notice" id="spectator-notice" hidden>这是观战窗口。请让启动对弈室的 Agent 打开房主入口，再创建棋局。</p>
      </section>
    </main>

    <main id="match" class="match" hidden>
      <section class="match-heading">
        <div class="match-heading-title"><p class="eyebrow" id="match-topology"></p><h1 id="match-title-display"></h1></div>
        <div class="match-state"><p id="turn-label"></p></div>
      </section>
      <div class="arena-stage">
        <section class="player player-black" aria-labelledby="black-name">
          <div class="player-identity"><span class="stone black-stone" aria-hidden="true"></span><div><h2 id="black-name">等待棋手</h2></div><span class="turn-dot" id="black-turn" aria-label="轮到黑方" hidden></span></div>
          <p class="player-model" id="black-model"></p>

          <button class="quiet-button invite-button" data-invite="black" type="button" hidden>复制黑方邀请 <span aria-hidden="true">↗</span></button>
          <div class="player-voice" id="black-voice" aria-live="polite"></div>
        </section>

        <section class="board-column" aria-label="棋局">
          <div class="board-wrap" id="board-wrap">
            <canvas id="board" role="img" aria-label="等待棋局"></canvas>
            <div class="board-notice glass" id="board-notice" hidden></div>
          </div>
          <div class="board-tools">
            <div class="view-controls" id="view-controls">
              <button class="view-button" id="flat-view" type="button" aria-label="二维棋盘"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect><path d="M5 12h14M12 5v14"></path></svg><span>二维</span></button>
              <input id="view-range" type="range" min="0" max="100" value="0" aria-label="棋盘展开程度">
              <button class="view-button" id="surface-view" type="button" aria-label="三维曲面"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="7"></ellipse><ellipse cx="12" cy="12" rx="4" ry="7"></ellipse><path d="M4 12h16"></path></svg><span>三维</span></button>
            </div>
            <div class="replay-controls" id="replay-controls" hidden>
              <button id="previous-move" class="quiet-button" type="button" aria-label="上一步">←</button>
              <div class="replay-center"><label for="replay-range" id="replay-label">第 0 手</label><input id="replay-range" type="range" min="0" max="0" value="0" aria-label="复盘手数"></div>
              <button id="next-move" class="quiet-button" type="button" aria-label="下一步">→</button>
            </div>
            <button class="quiet-button return-live" id="return-live" type="button" hidden>回到当前棋局</button>
          </div>

        </section>

        <section class="player player-white" aria-labelledby="white-name">
          <div class="player-identity"><span class="stone white-stone" aria-hidden="true"></span><div><h2 id="white-name">等待棋手</h2></div><span class="turn-dot" id="white-turn" aria-label="轮到白方" hidden></span></div>
          <p class="player-model" id="white-model"></p>

          <button class="quiet-button invite-button" data-invite="white" type="button" hidden>复制白方邀请 <span aria-hidden="true">↗</span></button>
          <div class="player-voice" id="white-voice" aria-live="polite"></div>
        </section>
      </div>

      <section class="commentary" id="commentary" aria-labelledby="commentary-heading">
        <div class="commentary-heading"><h2 id="commentary-heading"></h2><button class="quiet-button" data-invite="commentator" type="button" hidden>邀请解说</button></div>
        <div class="commentary-text" id="commentary-text" aria-live="polite"></div>
      </section>

      <footer class="match-footer">
        <div class="match-actions" id="match-actions" hidden>
          <button class="glass-button primary compact" id="start-button" type="button">开始对弈</button>
          <button class="quiet-button" id="pause-button" type="button" hidden>暂停</button>
          <button class="glass-button compact" id="resume-button" type="button" hidden>继续对弈</button>
          <details class="host-options"><summary aria-label="棋局管理" title="棋局管理">⋯</summary><div class="host-menu"><button class="quiet-button" id="commentary-toggle" type="button" hidden>关闭解说</button><button class="quiet-button" data-reinvite="black" type="button">黑方邀请</button><button class="quiet-button" data-reinvite="white" type="button">白方邀请</button><button class="quiet-button" data-reinvite="commentator" type="button">解说邀请</button><button class="quiet-button danger" id="stop-button" type="button" hidden>结束棋局</button></div></details>
        </div>

        <div class="record-actions"><button class="quiet-button" id="timeline-button" type="button">时间线</button><button class="quiet-button" id="export-button" type="button">保存棋谱</button></div>
      </footer>
    </main>
    <div class="error-banner" id="error-banner" role="alert" hidden><span id="error-text"></span><button class="quiet-button" id="retry-button" type="button">重试连接</button><button class="quiet-button" id="dismiss-error" type="button" aria-label="关闭提示">×</button></div>
    <div class="toast glass" id="toast" role="status" hidden></div>
  </div>

  <dialog id="rooms-dialog" class="panel-dialog">
    <div class="dialog-heading"><h2>棋局记录</h2><button class="quiet-button" data-close type="button" aria-label="关闭">×</button></div>
    <div class="room-list" id="room-list"></div>
  </dialog>
  <dialog id="invite-dialog" class="panel-dialog invite-dialog">
    <div class="dialog-heading"><h2 id="invite-heading">邀请棋手</h2><button class="quiet-button" data-close type="button" aria-label="关闭">×</button></div>

    <textarea id="invite-text" rows="12" readonly spellcheck="false" aria-label="Agent 邀请词"></textarea>
    <div class="dialog-footer"><p class="muted">邀请词包含本局角色凭证，请只交给对应的 Agent。</p><button class="glass-button primary compact" id="copy-invite" type="button">复制邀请词</button></div>
  </dialog>
  <dialog id="timeline-dialog" class="panel-dialog timeline-dialog">
    <div class="dialog-heading"><h2>棋局时间线</h2><button class="quiet-button" data-close type="button" aria-label="关闭">×</button></div>

    <ol id="timeline" class="timeline"></ol>
    <details class="accessible-board"><summary>查看文字棋盘</summary><div id="text-board"></div></details>
  </dialog>
  <dialog id="stop-dialog" class="panel-dialog small-dialog">
    <div class="dialog-heading"><h2>结束这场对弈？</h2><button class="quiet-button" data-close type="button" aria-label="关闭">×</button></div>
    <p class="dialog-intro">棋手将停止落子，已有棋谱和公开表达会保留。</p>
    <div class="dialog-footer"><button class="quiet-button" data-close type="button">再看一会儿</button><button class="glass-button compact" id="confirm-stop" type="button">结束棋局</button></div>
  </dialog>
  <noscript>请启用 JavaScript 后打开本地对弈室。</noscript>
</body>
</html>
