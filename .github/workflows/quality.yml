name: Quality

on:
  push:
    branches:
      - main
      - dev
      - xiaohongshu
      - bilibili
      - wechat
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run deterministic tests
        run: npm test

      - name: Validate and build the current H5 release
        run: npm run build:xiaohongshu
