<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" data-model="shaded-bounded-plane">
  <desc>P(u,v)=(u,v,0), -1≤u,v≤1</desc>
  <defs>
    <filter id="silhouette" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="expanded"/>
      <feFlood flood-color="#21302c" result="ink"/>
      <feComposite in="ink" in2="expanded" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#silhouette)">
    <path d="M 26.00 120.30 L 168.41 221.97 L 230.00 135.70 L 87.59 34.03 Z" fill="#c0d3ce" stroke="#c0d3ce" stroke-width="0.85" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
  <g>
  </g>
</svg>
