<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#f2efe7" />
  <title>拓扑五子棋</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="screens">
      <section class="screen home-screen is-active" id="homeScreen" aria-label="关卡选择">
        <div class="home-scroll">
          <div class="hero">
            <div class="hero-copy">
              <h1>拓扑<br />五子棋</h1>
              <p class="hero-line">边界之外，也能连成一线。</p>
            </div>
            <img class="hero-brand" src="./assets/brand-icon.png" alt="" aria-hidden="true" />
          </div>

          <div class="journey-head">
            <span>旅程</span>
            <span class="progress-count" id="progressCount">0 / 7</span>
          </div>

          <div class="level-grid" id="levelGrid">
            <button class="level-card" type="button" data-level="0" aria-label="方庭">
              <img class="level-glyph" src="./assets/topologies/plane.svg" alt="" aria-hidden="true" />
              <span class="level-type">平面</span>
              <span class="level-name">方庭</span>
            </button>

            <button class="level-card" type="button" data-level="1" aria-label="回廊">
              <img class="level-glyph" src="./assets/topologies/cylinder.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/cylinder.svg" alt="" /><span>?</span></span>
              <span class="level-type">圆柱</span>
              <span class="level-name">回廊</span>
            </button>

            <button class="level-card" type="button" data-level="2" aria-label="环游">
              <img class="level-glyph" src="./assets/topologies/torus.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/torus.svg" alt="" /><span>?</span></span>
              <span class="level-type">环面</span>
              <span class="level-name">环游</span>
            </button>

            <button class="level-card" type="button" data-level="3" aria-label="扭带">
              <img class="level-glyph" src="./assets/topologies/mobius.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/mobius.svg" alt="" /><span>?</span></span>
              <span class="level-type">莫比乌斯环</span>
              <span class="level-name">扭带</span>
            </button>

            <button class="level-card" type="button" data-level="4" aria-label="瓶界">
              <img class="level-glyph" src="./assets/topologies/klein.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/klein.svg" alt="" /><span>?</span></span>
              <span class="level-type">克莱因瓶</span>
              <span class="level-name">瓶界</span>
            </button>

            <button class="level-card" type="button" data-level="5" aria-label="双生">
              <img class="level-glyph" src="./assets/topologies/projective.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/projective.svg" alt="" /><span>?</span></span>
              <span class="level-type">实射影平面</span>
              <span class="level-name">双生</span>
            </button>

            <button class="level-card level-card-finale" type="button" data-level="6" aria-label="归圆">
              <img class="level-glyph" src="./assets/topologies/sphere.svg" alt="" aria-hidden="true" />
              <span class="level-mystery" aria-hidden="true"><img class="level-silhouette" src="./assets/silhouettes/sphere.svg" alt="" /><span>?</span></span>
              <span class="level-type">球面</span>
              <span class="level-name">归圆</span>
            </button>
          </div>
        </div>

      </section>

      <section class="screen game-screen" id="gameScreen" aria-label="对局">
        <header class="topbar game-topbar">
          <button class="icon-button" id="backButton" type="button" aria-label="返回关卡">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" /></svg>
          </button>
          <div class="game-title">
            <strong id="gameLevelName">方庭</strong>
          </div>
          <button class="icon-button" id="gameSettingsButton" type="button" aria-label="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4" />
            </svg>
          </button>
        </header>

        <div class="match-strip">
          <div class="player-chip is-active" id="humanChip">
            <span class="mini-stone stone-dark"></span>
            <span>你</span>
          </div>
          <div class="turn-status" id="turnStatus" role="status">你的回合</div>
          <div class="player-chip" id="aiChip">
            <span id="difficultyLabel">机敏</span>
            <span class="mini-stone stone-light"></span>
          </div>
        </div>

        <div class="board-stage" id="boardStage">
          <canvas id="boardCanvas" aria-label="五子棋棋盘"></canvas>
          <div class="thinking" id="thinkingIndicator" aria-hidden="true">
            <i></i><i></i><i></i>
          </div>
        </div>

        <div class="dimension-control" id="dimensionControl" hidden>
          <button class="tool-button dimension-endpoint" id="viewFlatButton" type="button" aria-label="二维" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM9.33 4v16M14.67 4v16M4 9.33h16M4 14.67h16" /></svg>
            <span>二维</span>
          </button>
          <div class="dimension-range" id="dimensionRange">
            <span class="dimension-track" aria-hidden="true"></span>
            <i class="dimension-glass-thumb" id="dimensionThumb" aria-hidden="true"><span class="dimension-lens-track"></span></i>
            <input class="dimension-slider" id="dimensionSlider" type="range" min="0" max="1" step="0.001" value="0" aria-label="二维/三维" />
          </div>
          <button class="tool-button dimension-endpoint" id="viewSpatialButton" type="button" aria-label="三维" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6c0-1.7 3.1-3 7-3s7 1.3 7 3-3.1 3-7 3-7-1.3-7-3Zm0 0v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" /></svg>
            <span>三维</span>
          </button>
        </div>

        <div class="game-action-deck">
          <div class="endgame-review-tools" id="endgameReviewTools" hidden>
            <button class="tool-button endgame-tool" id="reviewPreviousButton" type="button" aria-label="上一步" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-5-5 5 5 5" /></svg>
              <span>上一步</span>
            </button>
            <button class="tool-button endgame-tool review-toggle-button" id="reviewToggleButton" type="button" aria-label="复盘棋局">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="reviewToggleIconPath" d="M9 8H5V4M5 8c2-3 5-4 8-4 5 0 8 4 8 8s-3 8-8 8c-3 0-6-2-7-4" /></svg>
              <span id="reviewToggleButtonText">复盘</span>
            </button>
            <button class="tool-button endgame-tool" id="reviewNextButton" type="button" aria-label="下一步" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" /></svg>
              <span>下一步</span>
            </button>
          </div>

          <div class="game-tools" id="gameTools">
            <button class="tool-button" id="undoButton" type="button" aria-label="悔棋">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="undoIconPath" d="M9 8H5v-4M5 8c2-3 5-4 8-4 5 0 8 4 8 8s-3 8-8 8c-3 0-6-2-7-4" /></svg>
              <span id="undoButtonText">悔棋</span>
            </button>
            <button class="tool-button boundary-demo-button" id="boundaryDemoButton" type="button" aria-label="重新体验本关边界指引">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M15.1 14c.2-.7.7-1.2 1.2-1.7A6 6 0 1 0 7.7 12.3c.5.5 1 1 1.2 1.7h6.2Z" /></svg>
              <span>边界演示</span>
            </button>
            <button class="tool-button journey-button" id="journeyButton" type="button" aria-label="返回旅程" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6" /></svg>
              <span>旅程</span>
            </button>
            <button class="tool-button settled-replay-button" id="settledReplayButton" type="button" aria-label="再玩一次" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="settledReplayIconPath" d="M20 7v5h-5M19 12a7 7 0 1 0-2 5" /></svg>
              <span id="settledReplayButtonText">再来</span>
            </button>
            <button class="tool-button next-level-button" id="nextLevelButton" type="button" aria-label="进入下一关" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="nextLevelIconPath" d="m9 6 6 6-6 6" /></svg>
              <span id="nextLevelButtonText">下一关</span>
            </button>
            <button class="tool-button" id="restartButton" type="button" aria-label="重新开始">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path id="restartIconPath" d="M20 7v5h-5M19 12a7 7 0 1 0-2 5" /></svg>
              <span id="restartButtonText">重来</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>

    <button class="developer-fab" id="developerButton" type="button" aria-label="开发者工具" hidden>DEV</button>

    <section class="sheet settings-sheet" id="settingsSheet" aria-modal="true" role="dialog" aria-labelledby="settingsTitle" hidden>
      <div class="settings-softbody">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="settingsTitle">设置</h2>
          <button class="close-button" id="closeSettingsButton" type="button" aria-label="关闭">×</button>
        </div>
        <div class="setting-row setting-stack">
          <span class="setting-label">对手</span>
          <div class="segmented" id="difficultyControl" role="group" aria-label="对手水平">
            <i class="segmented-glass-thumb" id="difficultyThumb" aria-hidden="true">
              <span class="segmented-lens-track"><b>随性</b><b>机敏</b><b>深思</b></span>
            </i>
            <button type="button" data-difficulty="easy" aria-pressed="false">随性</button>
            <button class="is-active" type="button" data-difficulty="normal" aria-pressed="true">机敏</button>
            <button type="button" data-difficulty="hard" aria-pressed="false">深思</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="setting-label">落点提示</span>
          <button class="switch is-on" id="hintSwitch" type="button" role="switch" aria-checked="true"><i><span class="switch-lens-track"></span></i></button>
        </div>
        <div class="setting-row">
          <span class="setting-label">声音</span>
          <button class="switch is-on" id="soundSwitch" type="button" role="switch" aria-checked="true"><i><span class="switch-lens-track"></span></i></button>
        </div>
        <button class="sheet-done" id="settingsDoneButton" type="button">完成</button>
      </div>
    </section>

    <section class="sheet settings-sheet developer-sheet" id="developerSheet" aria-modal="true" role="dialog" aria-labelledby="developerTitle" hidden>
      <div class="settings-softbody developer-softbody">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="developerTitle">测试控制台</h2>
          <button class="close-button" id="closeDeveloperButton" type="button" aria-label="关闭开发者工具">×</button>
        </div>

        <div class="developer-section" id="developerGameControls">
          <div class="developer-section-head">
            <span>当前对局</span>
            <small id="developerGameStatus">未进入棋局</small>
          </div>
          <div class="setting-row developer-toggle-row">
            <span class="setting-label">暂停 AI 落子</span>
            <button class="switch" id="developerPauseSwitch" type="button" role="switch" aria-checked="false"><i><span class="switch-lens-track"></span></i></button>
          </div>
          <div class="developer-control-row">
            <span class="setting-label">点棋盘时落下</span>
            <div class="segmented developer-piece-control" id="developerPieceControl" data-index="0" role="group" aria-label="开发者落子身份">
              <i class="segmented-glass-thumb" aria-hidden="true"></i>
              <button class="is-active" type="button" data-developer-player="1" aria-pressed="true">玩家 · 黑</button>
              <button type="button" data-developer-player="-1" aria-pressed="false">对手 · 白</button>
            </div>
          </div>
          <div class="developer-action-grid">
            <button type="button" id="developerPlayerWin">玩家胜利</button>
            <button type="button" id="developerAiWin">对手胜利</button>
            <button type="button" id="developerDraw">平局通关</button>
            <button type="button" id="developerClearBoard">清空棋盘</button>
          </div>
          <div class="developer-action-grid developer-hint-grid">
            <button type="button" id="developerHintThree">活三提示</button>
            <button type="button" id="developerHintFour">四子提示</button>
          </div>
        </div>

        <div class="developer-section developer-unlock-section">
          <div class="developer-section-head">
            <span>解锁至</span>
            <button class="developer-reset" id="developerResetProgress" type="button">重置</button>
          </div>
          <div class="developer-unlock-grid" role="group" aria-label="手动解锁关卡">
            <button type="button" data-developer-unlock="0">01</button>
            <button type="button" data-developer-unlock="1">02</button>
            <button type="button" data-developer-unlock="2">03</button>
            <button type="button" data-developer-unlock="3">04</button>
            <button type="button" data-developer-unlock="4">05</button>
            <button type="button" data-developer-unlock="5">06</button>
            <button type="button" data-developer-unlock="6">07</button>
          </div>
        </div>

        <button class="sheet-done" id="developerDoneButton" type="button">完成</button>
      </div>
    </section>
  </div>

  <script src="./assets/topology.js"></script>
  <script src="./assets/topology-morph.js"></script>
  <script src="./assets/board-view-logic.js"></script>
  <script src="./assets/liquid-range.js"></script>
  <script src="./assets/game-replay.js"></script>
  <script src="./assets/level-config.js"></script>
  <script src="./assets/game.js"></script>
</body>
</html>
