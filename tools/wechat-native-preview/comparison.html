<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微信原生视觉对照</title>
  <style>
    html,
    body,
    main {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ddd8cc;
    }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <main>
    <img id="reference" alt="H5 visual reference" />
    <img id="implementation" alt="WeChat native implementation" />
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    document.getElementById("reference").src = query.get("reference") || "";
    document.getElementById("implementation").src = query.get("implementation") || "";
  </script>
</body>
</html>
