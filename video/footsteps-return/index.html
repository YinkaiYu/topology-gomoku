<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script src="./src/vendor/gsap.min.js"></script>
    <script src="./assets/game-source/assets/topology-morph.js"></script>
    <title>Footsteps Return PV</title>
  </head>
  <body>
    <main
      id="footsteps-return-root"
      data-composition-id="footsteps-return"
      data-start="0"
      data-duration="165"
      data-width="3840"
      data-height="2160"
      data-fps="60"
      aria-label="Footsteps Return PV composition"
    >
      <div class="master-stage" data-master-stage>
        <div class="scene-layer" data-scene-layer></div>
        <div class="caption-group" data-caption-group aria-live="off">
          <p class="caption-group__text" data-caption-text></p>
        </div>
      </div>
    </main>
    <script type="module">
      import { bootstrapComposition } from "./src/bootstrap.js";

      const runtime = bootstrapComposition();
      window.__timelines = window.__timelines || {};
      window.__timelines["footsteps-return"] = runtime.timeline;
